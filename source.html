<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>source — deezsrc</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div class="noise"></div>
  <div class="lines"></div>
  <div class="vignette"></div>
  <nav>
    <a href="index.html" class="logo">deezsrc</a>
    <div class="nav-r">
      <a href="index.html">home</a>
      <a href="projects.html">projects</a>
    </div>
  </nav>
  <div class="wrap src-page">
    <div class="src-top" id="src-top"></div>
    <div class="src-tabs">
      <button class="stab on" data-p="readme-p">readme</button>
      <button class="stab" data-p="source-p">source</button>
    </div>
    <div class="src-body">
      <div class="panel on" id="readme-p">
        <div class="readme" id="readme-c"></div>
      </div>
      <div class="panel" id="source-p">
        <div class="explorer">
          <div class="tree">
            <div class="tree-head">files</div>
            <div id="tree-root"></div>
          </div>
          <div class="code-pane" id="code-pane">
            <div class="code-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
              <span>select a file</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer><p>deezsrc 2026</p></footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="three-bg.js"></script>
  <script src="source-app.js"></script>
</body>
</html>
